{% extends "base.html" %}{% block title %}Faculty sign in{% endblock %}{% block content %}
<div class="auth-card">
  <div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div>
  <p class="eyebrow text-center">ATTENDEASE</p>
  <h1 class="auth-title">Faculty sign in</h1>
  <p class="text-muted text-center mb-4">Sign in to manage student records and attendance.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Email address</label><input class="form-control form-control-lg" type="email" name="email" required autocomplete="username" placeholder="you@college.edu"></div>
    <div class="mb-4"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-lg w-100">Faculty sign in</button>
  </form>
  <div class="text-end mt-3"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
  <div class="text-center mt-4"><a href="{{ url_for('student_attendance') }}">Student? View your attendance</a></div>
</div>
{% endblock %}
