{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<div class="auth-card"><div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div><p class="eyebrow text-center">WELCOME BACK</p><h1 class="auth-title">Sign in to AttendEase</h1><p class="text-muted text-center mb-4">Manage classroom attendance in one place.</p>
<form method="post"><div class="mb-3"><label class="form-label">Email address</label><input class="form-control form-control-lg" type="email" name="email" required placeholder="you@college.edu"></div><div class="mb-4"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" required placeholder="Your password"></div><button class="btn btn-primary btn-lg w-100">Sign in <i class="bi bi-arrow-right ms-1"></i></button></form>
<p class="text-center text-muted mt-4 mb-0">New faculty member? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
