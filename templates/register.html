{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth-card"><div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div><p class="eyebrow text-center">FACULTY PORTAL</p><h1 class="auth-title">Create your account</h1><p class="text-muted text-center mb-4">Get started with your attendance workspace.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control form-control-lg" name="name" required maxlength="100" placeholder="Your name"></div><div class="mb-3"><label class="form-label">Email address</label><input class="form-control form-control-lg" type="email" name="email" required placeholder="you@college.edu"></div><div class="mb-4"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" minlength="8" required placeholder="At least 8 characters"></div><button class="btn btn-primary btn-lg w-100">Create account <i class="bi bi-arrow-right ms-1"></i></button></form>
<p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
