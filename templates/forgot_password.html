{% extends "base.html" %}{% block title %}Forgot password{% endblock %}{% block content %}
<div class="auth-card">
  <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
  <p class="eyebrow text-center">ACCOUNT RECOVERY</p>
  <h1 class="auth-title">Forgot your password?</h1>
  <p class="text-muted text-center mb-4">Enter your faculty account email. If the account exists, we'll send a secure reset link.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4"><label class="form-label">Email address</label><input class="form-control form-control-lg" type="email" name="email" required autocomplete="email" placeholder="you@college.edu"></div>
    <button class="btn btn-primary btn-lg w-100">Send reset link</button>
  </form>
  <p class="text-center mt-4 mb-0"><a href="{{ url_for('login') }}"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a></p>
</div>
{% endblock %}
