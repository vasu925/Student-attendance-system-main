{% extends "base.html" %}{% block title %}Forgot password{% endblock %}{% block content %}
<div class="auth-card">
  <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
  <p class="eyebrow text-center">ACCOUNT RECOVERY</p>
  <h1 class="auth-title">Reset faculty password</h1>
  <p class="text-muted text-center mb-4">Enter your registered email, the recovery code provided by your project administrator, and your new password.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Faculty email</label><input class="form-control form-control-lg" type="email" name="email" required autocomplete="username"></div>
    <div class="mb-3"><label class="form-label">Recovery code</label><input class="form-control form-control-lg" type="password" name="recovery_code" required autocomplete="off"></div>
    <div class="mb-3"><label class="form-label">New password</label><input class="form-control form-control-lg" type="password" name="password" required minlength="8" autocomplete="new-password"></div>
    <div class="mb-4"><label class="form-label">Confirm new password</label><input class="form-control form-control-lg" type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></div>
    <button class="btn btn-primary btn-lg w-100">Reset password</button>
  </form>
  <p class="text-center mt-4 mb-0"><a href="{{ url_for('login') }}"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a></p>
</div>
{% endblock %}
